name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # DB-independent backend checks — run once, not per database.
  backend-checks:
    name: Backend checks
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml -p ci-backend-checks build backend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml -p ci-backend-checks run --rm --no-deps backend ruff check app/ tests/

      - name: Format check
        run: docker compose -f docker-compose.ci.yml -p ci-backend-checks run --rm --no-deps backend ruff format --check app/ tests/

      - name: Security audit
        run: docker compose -f docker-compose.ci.yml -p ci-backend-checks run --rm --no-deps backend sh -c "pip install pip-audit && pip-audit --strict"

      - name: Build MCP image
        run: docker compose -f docker-compose.ci.yml -p ci-backend-checks build mcp

      - name: MCP server tests
        run: docker compose -f docker-compose.ci.yml -p ci-backend-checks run --rm --no-deps mcp pytest test_server.py -q

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml -p ci-backend-checks down -v
          docker image prune -f

  # The two databases are first-class, symmetric test targets: same suite,
  # same coverage gate. Neither is primary. See ADR-0018 / ADR-0020.
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml -p ci-backend-sqlite build backend

      - name: Run tests with coverage
        run: |
          docker compose -f docker-compose.ci.yml -p ci-backend-sqlite run --rm --no-deps \
            -e TEST_DATABASE_URL=sqlite:///:memory: \
            backend pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=78

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml -p ci-backend-sqlite down -v
          docker image prune -f

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml -p ci-backend-pg --profile pgtest build backend

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.ci.yml -p ci-backend-pg --profile pgtest up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml -p ci-backend-pg --profile pgtest exec -T postgres \
              pg_isready -U todo -d shard_test 2>/dev/null && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become healthy"
          docker compose -f docker-compose.ci.yml -p ci-backend-pg --profile pgtest logs postgres
          exit 1

      - name: Run tests with coverage
        run: |
          docker compose -f docker-compose.ci.yml -p ci-backend-pg --profile pgtest run --rm --no-deps \
            -e TEST_DATABASE_URL=postgresql+psycopg://todo:todo_dev@postgres:5432/shard_test \
            backend pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=78

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml -p ci-backend-pg --profile pgtest down -v
          docker image prune -f

  frontend:
    name: Frontend tests
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker compose -f docker-compose.ci.yml -p ci-frontend build frontend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npm run lint -- --max-warnings 10

      - name: Run tests
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npx vitest run

      - name: Security audit
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npm audit --audit-level=moderate

      - name: Build
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npx vite build

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml -p ci-frontend down -v
          docker image prune -f

  integration:
    name: Integration smoke test (prod)
    needs: [backend-checks, backend-sqlite, backend-postgres, frontend]
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: docker compose -f docker-compose.ci.yml -p ci-integration --profile integration build backend-prod frontend-prod

      - name: Start services
        run: docker compose -f docker-compose.ci.yml -p ci-integration --profile integration up -d backend-prod frontend-prod

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml -p ci-integration --profile integration exec backend-prod \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration logs backend-prod
          exit 1

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ci-integration-frontend-prod-1 2>/dev/null || echo "not found")
            echo "Attempt $i: frontend-prod health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Frontend health check failed"
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration logs frontend-prod
          exit 1

      - name: Smoke test frontend
        run: |
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration exec frontend-prod \
            wget -qO- http://127.0.0.1/ > /dev/null

      - name: Build e2e image
        run: docker compose -f docker-compose.ci.yml -p ci-integration --profile integration build e2e

      - name: Run Playwright e2e suite
        run: |
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration \
            run --rm --no-deps e2e npx playwright test --reporter=line

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration down -v
          docker image prune -f
          docker builder prune -f --filter until=48h

  publish:
    name: Publish Docker images
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ci-builder
    steps:
      # The backend and frontend steps only re-tag images the integration job
      # left on the runner, so this job used to need no source at all. Building
      # the MCP image here does need it — without the checkout the compose file
      # is missing and publish fails *after* pushing backend and frontend, which
      # takes the deploy down with it.
      - uses: actions/checkout@v4

      - name: Login to registry
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Compute image prefix
        run: echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Tag and push backend
        run: |
          docker tag ci-integration-backend-prod:latest $IMAGE_PREFIX/backend:${{ github.sha }}
          docker tag ci-integration-backend-prod:latest $IMAGE_PREFIX/backend:latest
          docker push $IMAGE_PREFIX/backend:${{ github.sha }}
          docker push $IMAGE_PREFIX/backend:latest

      - name: Tag and push frontend
        run: |
          docker tag ci-integration-frontend-prod:latest $IMAGE_PREFIX/frontend:${{ github.sha }}
          docker tag ci-integration-frontend-prod:latest $IMAGE_PREFIX/frontend:latest
          docker push $IMAGE_PREFIX/frontend:${{ github.sha }}
          docker push $IMAGE_PREFIX/frontend:latest

      # Built here rather than reused from the integration stack: the MCP server has no
      # part in that stack (its tests mock every HTTP call), but the image has to exist
      # in the registry for a deployment that enables remote MCP (ADR-0076).
      - name: Build, tag and push MCP server
        run: |
          docker compose -f docker-compose.ci.yml -p ci-publish build mcp
          docker tag ci-publish-mcp:latest $IMAGE_PREFIX/mcp:${{ github.sha }}
          docker tag ci-publish-mcp:latest $IMAGE_PREFIX/mcp:latest
          docker push $IMAGE_PREFIX/mcp:${{ github.sha }}
          docker push $IMAGE_PREFIX/mcp:latest

  deploy:
    name: Deploy to production
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: cd-deployer
    defaults:
      run:
        shell: sh
    steps:
      - name: Login to registry
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Compute deploy variables
        env:
          CUSTOM_DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "DEPLOY_DIR=${CUSTOM_DEPLOY_DIR:-/opt/deployments/$REPO_NAME}" >> $GITHUB_ENV

      - name: Write .env file
        env:
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
          DB_MAX_OVERFLOW: ${{ vars.DB_MAX_OVERFLOW }}
          DB_POOL_TIMEOUT: ${{ vars.DB_POOL_TIMEOUT }}
          DB_SSL_MODE: ${{ vars.DB_SSL_MODE }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_PROXY_HEADER: ${{ vars.AUTH_PROXY_HEADER }}
          AUTH_TOKEN_TTL: ${{ vars.AUTH_TOKEN_TTL }}
          AUTH_MAX_ATTEMPTS: ${{ vars.AUTH_MAX_ATTEMPTS }}
          AUTH_LOCKOUT_SECONDS: ${{ vars.AUTH_LOCKOUT_SECONDS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
          AGENT_CONTEXT_INSTRUCTIONS: ${{ vars.AGENT_CONTEXT_INSTRUCTIONS }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          MCP_HTTP_TOKEN: ${{ secrets.MCP_HTTP_TOKEN }}
        run: |
          mkdir -p "$DEPLOY_DIR"
          cat > "$DEPLOY_DIR/.env" <<ENVEOF
          BACKEND_PORT=${BACKEND_PORT:-8000}
          FRONTEND_PORT=${FRONTEND_PORT:-80}
          DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
          DB_POOL_SIZE=${DB_POOL_SIZE:-5}
          DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
          DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
          DB_SSL_MODE=${DB_SSL_MODE:-}
          AUTH_PASSWORD=${AUTH_PASSWORD:-}
          AUTH_PROXY_HEADER=${AUTH_PROXY_HEADER:-}
          AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL:-604800}
          AUTH_MAX_ATTEMPTS=${AUTH_MAX_ATTEMPTS:-5}
          AUTH_LOCKOUT_SECONDS=${AUTH_LOCKOUT_SECONDS:-300}
          SMTP_HOST=${SMTP_HOST:-}
          SMTP_PORT=${SMTP_PORT:-587}
          SMTP_USER=${SMTP_USER:-}
          SMTP_PASS=${SMTP_PASS:-}
          SMTP_FROM=${SMTP_FROM:-}
          SMTP_USE_TLS=${SMTP_USE_TLS:-true}
          LLM_PROVIDER=${LLM_PROVIDER:-stub}
          LLM_API_KEY=${LLM_API_KEY:-}
          LLM_MODEL=${LLM_MODEL:-}
          SUMMARY_HOUR=${SUMMARY_HOUR:-8}
          AGENT_CONTEXT_INSTRUCTIONS=${AGENT_CONTEXT_INSTRUCTIONS:-}
          MCP_API_KEY=${MCP_API_KEY:-}
          MCP_HTTP_TOKEN=${MCP_HTTP_TOKEN:-}
          ENVEOF

          # Whether this deployment serves remote MCP at all. Both halves are required:
          # the API key it acts with, and the bearer token that guards the endpoint
          # (ADR-0076). Missing either, the service is left out of the compose file
          # entirely rather than deployed in a half-configured state.
          if [ -n "${MCP_API_KEY:-}" ] && [ -n "${MCP_HTTP_TOKEN:-}" ]; then
            echo "MCP_ENABLED=1" >> $GITHUB_ENV
            echo "Remote MCP: enabled"
          else
            echo "MCP_ENABLED=0" >> $GITHUB_ENV
            echo "Remote MCP: disabled (set both MCP_API_KEY and MCP_HTTP_TOKEN secrets to enable)"
          fi

      - name: Generate compose file
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > "$DEPLOY_DIR/docker-compose.yml" <<EOF
          services:
            backend:
              image: $IMAGE_PREFIX/backend:$IMAGE_TAG
              container_name: ${REPO_NAME}-backend
              expose:
                - "8000"
              volumes:
                - ./data:/app/data
              env_file:
                - .env
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 10s
              networks:
                - app-network
            frontend:
              image: $IMAGE_PREFIX/frontend:$IMAGE_TAG
              container_name: ${REPO_NAME}-frontend
              ports:
                - "127.0.0.1:\${FRONTEND_PORT:-80}:80"
              depends_on:
                backend:
                  condition: service_healthy
              restart: unless-stopped
              networks:
                - app-network
          EOF

          # Remote MCP (ADR-0076): reachable only from the frontend's nginx over the
          # internal network — no host port. The only way in is https://<host>/mcp with
          # the bearer token, so the endpoint has exactly one door, like every other
          # public surface here.
          if [ "$MCP_ENABLED" = "1" ]; then
            cat >> "$DEPLOY_DIR/docker-compose.yml" <<EOF
            mcp:
              image: $IMAGE_PREFIX/mcp:$IMAGE_TAG
              container_name: ${REPO_NAME}-mcp
              expose:
                - "8001"
              environment:
                - MCP_TRANSPORT=http
                - MCP_HTTP_PORT=8001
                - API_BASE_URL=http://backend:8000
                - API_KEY=\${MCP_API_KEY}
                - MCP_HTTP_TOKEN=\${MCP_HTTP_TOKEN}
              env_file:
                - .env
              depends_on:
                backend:
                  condition: service_healthy
              restart: unless-stopped
              networks:
                - app-network
          EOF
          fi

          cat >> "$DEPLOY_DIR/docker-compose.yml" <<EOF
          networks:
            app-network:
          EOF

      - name: Persist deploy files to host
        run: |
          cat "$DEPLOY_DIR/.env" | docker run --rm -i -v "${DEPLOY_DIR}:/deploy" docker:27-cli sh -c 'cat > /deploy/.env'
          cat "$DEPLOY_DIR/docker-compose.yml" | docker run --rm -i -v "${DEPLOY_DIR}:/deploy" docker:27-cli sh -c 'cat > /deploy/docker-compose.yml'

      - name: Pull images
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" pull

      # The schema has to reach head before anything serves against it, and exactly once:
      # the lifespan runs per uvicorn worker, so it can create a new schema but must not
      # upgrade an existing one (ADR-0064).
      #
      # Nothing is stopped first. The first version of this step ran `stop backend` here so
      # that no process was reading the database while it was being rewritten — and then the
      # migration refused, the job ended, `up -d` never ran, and production stayed down with
      # its backend stopped. A step that can fail must not be the one holding production
      # open. Leaving the old container running costs a few seconds of old code against a
      # new schema; getting it wrong costs an outage that lasts until a human notices.
      - name: Apply database migrations
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" run --rm --no-deps backend python -m app.db_schema

      - name: Deploy services
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" up -d --remove-orphans

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' $REPO_NAME-backend 2>/dev/null || echo "not found")
            echo "Attempt $i: backend health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker logs $REPO_NAME-backend --tail 50
          exit 1

      - name: Verify frontend
        run: |
          for i in $(seq 1 10); do
            docker exec $REPO_NAME-frontend wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Frontend verification failed"
          docker logs $REPO_NAME-frontend --tail 50
          exit 1

      # Negative control: the endpoint has to be reachable *and* closed. A 200 here would
      # mean either the SPA answered its own path with index.html (ADR-0071) or the token
      # check is not running; a 502 means nginx has no mcp container to reach.
      - name: Verify remote MCP is reachable and refuses an unauthenticated call
        run: |
          [ "$MCP_ENABLED" = "1" ] || { echo "Remote MCP disabled; nothing to verify"; exit 0; }
          i=1
          while [ $i -le 15 ]; do
            out=$(docker exec $REPO_NAME-frontend wget -q -O - \
              --header='Content-Type: application/json' --post-data='{}' \
              http://127.0.0.1:80/mcp 2>&1 || true)
            case "$out" in
              *401*) echo "MCP endpoint up and refusing unauthenticated calls"; exit 0 ;;
              *502*) echo "Attempt $i: nginx cannot reach the mcp container yet" ;;
              *) echo "Attempt $i: unexpected response: $out" ;;
            esac
            i=$((i + 1))
            sleep 2
          done
          echo "Remote MCP verification failed"
          docker logs $REPO_NAME-mcp --tail 50
          exit 1

      - name: Show deployment status
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" ps -a
