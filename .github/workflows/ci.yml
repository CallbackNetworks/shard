name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml -p ci-backend build backend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml -p ci-backend run --rm backend ruff check app/ tests/

      - name: Format check
        run: docker compose -f docker-compose.ci.yml -p ci-backend run --rm backend ruff format --check app/ tests/

      - name: Run tests with coverage
        run: docker compose -f docker-compose.ci.yml -p ci-backend run --rm backend pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Security audit
        run: docker compose -f docker-compose.ci.yml -p ci-backend run --rm backend sh -c "pip install pip-audit && pip-audit --strict"

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml -p ci-backend down -v

  frontend:
    name: Frontend tests
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker compose -f docker-compose.ci.yml -p ci-frontend build frontend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npm run lint -- --max-warnings 300

      - name: Run tests
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npx vitest run

      - name: Security audit
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npm audit --audit-level=moderate

      - name: Build
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npx vite build

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml -p ci-frontend down -v

  integration:
    name: Integration smoke test (prod)
    needs: [backend, frontend]
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: docker compose -f docker-compose.ci.yml -p ci-integration --profile integration build backend-prod frontend-prod

      - name: Start services
        run: docker compose -f docker-compose.ci.yml -p ci-integration --profile integration up -d backend-prod frontend-prod

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml -p ci-integration --profile integration exec backend-prod \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration logs backend-prod
          exit 1

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ci-integration-frontend-prod-1 2>/dev/null || echo "not found")
            echo "Attempt $i: frontend-prod health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Frontend health check failed"
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration logs frontend-prod
          exit 1

      - name: Smoke test frontend
        run: |
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration exec frontend-prod \
            wget -qO- http://127.0.0.1/ > /dev/null

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml -p ci-integration --profile integration down -v

  publish:
    name: Publish Docker images
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute image prefix
        run: echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest

  deploy:
    name: Deploy to production
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: cd-deployer
    defaults:
      run:
        shell: sh
    steps:
      - name: Login to registry
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Compute image prefix
        run: echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Generate compose file
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DEPLOY_DIR="$HOME/deployments/todo-platform"
          mkdir -p "$DEPLOY_DIR"
          cat > "$DEPLOY_DIR/docker-compose.yml" <<EOF
          services:
            backend:
              image: $IMAGE_PREFIX/backend:$IMAGE_TAG
              container_name: todo-backend
              ports:
                - "8000:8000"
              volumes:
                - backend_data:/app/data
              env_file:
                - .env
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 10s
              networks:
                - app-network
            frontend:
              image: $IMAGE_PREFIX/frontend:$IMAGE_TAG
              container_name: todo-frontend
              ports:
                - "80:80"
              depends_on:
                backend:
                  condition: service_healthy
              restart: unless-stopped
              networks:
                - app-network
          volumes:
            backend_data:
          networks:
            app-network:
          EOF

      - name: Pull images
        run: docker compose -f "$HOME/deployments/todo-platform/docker-compose.yml" pull

      - name: Deploy services
        run: |
          docker compose -f "$HOME/deployments/todo-platform/docker-compose.yml" up -d --remove-orphans

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' todo-backend 2>/dev/null || echo "not found")
            echo "Attempt $i: backend health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker logs todo-backend --tail 50
          exit 1

      - name: Verify frontend
        run: |
          for i in $(seq 1 10); do
            docker exec todo-frontend wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Frontend verification failed"
          docker logs todo-frontend --tail 50
          exit 1

      - name: Show deployment status
        run: docker compose -f "$HOME/deployments/todo-platform/docker-compose.yml" ps -a
