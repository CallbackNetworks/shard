name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # DB-independent backend checks — run once, not per database.
  backend-checks:
    name: Backend checks
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-backend-checks-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml build backend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml run --rm --no-deps backend ruff check app/ tests/

      - name: Format check
        run: docker compose -f docker-compose.ci.yml run --rm --no-deps backend ruff format --check app/ tests/

      - name: Security audit
        run: docker compose -f docker-compose.ci.yml run --rm --no-deps backend sh -c "pip install pip-audit && pip-audit --strict"

      # No separate MCP image or suite: the server is a module inside the backend
      # package now (ADR-0080), so `tests/test_mcp_server.py` runs in the backend
      # test jobs below — against both databases rather than once here.

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
          docker image prune -f

  # The two databases are first-class, symmetric test targets: same suite,
  # same coverage gate. Neither is primary. See ADR-0018 / ADR-0020.
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-backend-sqlite-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml build backend

      - name: Run tests with coverage
        run: |
          docker compose -f docker-compose.ci.yml run --rm --no-deps \
            -e TEST_DATABASE_URL=sqlite:///:memory: \
            backend pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=78

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
          docker image prune -f

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-backend-pg-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml --profile pgtest build backend

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.ci.yml --profile pgtest up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml --profile pgtest exec -T postgres \
              pg_isready -U todo -d shard_test 2>/dev/null && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become healthy"
          docker compose -f docker-compose.ci.yml --profile pgtest logs postgres
          exit 1

      - name: Run tests with coverage
        run: |
          docker compose -f docker-compose.ci.yml --profile pgtest run --rm --no-deps \
            -e TEST_DATABASE_URL=postgresql+psycopg://todo:todo_dev@postgres:5432/shard_test \
            backend pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=78

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml --profile pgtest down -v
          docker image prune -f

  frontend:
    name: Frontend tests
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-frontend-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build frontend image
        run: docker compose -f docker-compose.ci.yml build frontend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml run --rm frontend npm run lint -- --max-warnings 10

      - name: Run tests
        run: docker compose -f docker-compose.ci.yml run --rm frontend npx vitest run

      - name: Security audit
        run: docker compose -f docker-compose.ci.yml run --rm frontend npm audit --audit-level=moderate

      - name: Build
        run: docker compose -f docker-compose.ci.yml run --rm frontend npx vite build

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
          docker image prune -f

  integration:
    name: Integration smoke test (prod)
    needs: [backend-checks, backend-sqlite, backend-postgres, frontend]
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-integration-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build production images
        run: docker compose -f docker-compose.ci.yml --profile integration build backend-prod frontend-prod

      - name: Start services
        run: docker compose -f docker-compose.ci.yml --profile integration up -d backend-prod frontend-prod

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml --profile integration exec backend-prod \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker compose -f docker-compose.ci.yml --profile integration logs backend-prod
          exit 1

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$COMPOSE_PROJECT_NAME-frontend-prod-1" 2>/dev/null || echo "not found")
            echo "Attempt $i: frontend-prod health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Frontend health check failed"
          docker compose -f docker-compose.ci.yml --profile integration logs frontend-prod
          exit 1

      - name: Smoke test frontend
        run: |
          docker compose -f docker-compose.ci.yml --profile integration exec frontend-prod \
            wget -qO- http://127.0.0.1/ > /dev/null

      - name: Build e2e image
        run: docker compose -f docker-compose.ci.yml --profile integration build e2e

      - name: Run Playwright e2e suite
        run: |
          docker compose -f docker-compose.ci.yml --profile integration \
            run --rm --no-deps e2e npx playwright test --reporter=line

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml --profile integration down -v
          docker image prune -f
          docker builder prune -f --filter until=48h

  publish:
    name: Publish Docker images
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ci-builder
    steps:
      # The backend and frontend steps only re-tag images the integration job
      # left on the runner, so this job used to need no source at all. Building
      # the MCP image here does need it — without the checkout the compose file
      # is missing and publish fails *after* pushing backend and frontend, which
      # takes the deploy down with it.
      - uses: actions/checkout@v4

      - name: Login to registry
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Compute image prefix
        run: echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Compose names a built image `<project>-<service>`, and the integration job's
      # project is now per-run. Without this, two overlapping runs both produced
      # `ci-integration-backend-prod:latest` and publish could push the *other*
      # run's image — the wrong artifact reaching production, silently.
      - name: Name the images the integration job built
        run: echo "INTEGRATION_PROJECT=ci-integration-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Tag and push backend
        run: |
          docker tag $INTEGRATION_PROJECT-backend-prod:latest $IMAGE_PREFIX/backend:${{ github.sha }}
          docker tag $INTEGRATION_PROJECT-backend-prod:latest $IMAGE_PREFIX/backend:latest
          docker push $IMAGE_PREFIX/backend:${{ github.sha }}
          docker push $IMAGE_PREFIX/backend:latest

      - name: Tag and push frontend
        run: |
          docker tag $INTEGRATION_PROJECT-frontend-prod:latest $IMAGE_PREFIX/frontend:${{ github.sha }}
          docker tag $INTEGRATION_PROJECT-frontend-prod:latest $IMAGE_PREFIX/frontend:latest
          docker push $IMAGE_PREFIX/frontend:${{ github.sha }}
          docker push $IMAGE_PREFIX/frontend:latest

      # No MCP image to build: the server is a module inside the backend package
      # (ADR-0080), so a deployment that enables remote MCP runs the backend image
      # with a different command. One build context, one image.

  deploy:
    name: Deploy to production
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: cd-deployer
    defaults:
      run:
        shell: sh
    steps:
      - name: Login to registry
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Compute deploy variables
        env:
          CUSTOM_DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "DEPLOY_DIR=${CUSTOM_DEPLOY_DIR:-/opt/deployments/$REPO_NAME}" >> $GITHUB_ENV

      - name: Write .env file
        env:
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
          DB_MAX_OVERFLOW: ${{ vars.DB_MAX_OVERFLOW }}
          DB_POOL_TIMEOUT: ${{ vars.DB_POOL_TIMEOUT }}
          DB_SSL_MODE: ${{ vars.DB_SSL_MODE }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_PROXY_HEADER: ${{ vars.AUTH_PROXY_HEADER }}
          TRUSTED_PROXY_HOPS: ${{ vars.TRUSTED_PROXY_HOPS }}
          AUTH_TOKEN_TTL: ${{ vars.AUTH_TOKEN_TTL }}
          AUTH_MAX_ATTEMPTS: ${{ vars.AUTH_MAX_ATTEMPTS }}
          AUTH_LOCKOUT_SECONDS: ${{ vars.AUTH_LOCKOUT_SECONDS }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
          DIGEST_DAY: ${{ vars.DIGEST_DAY }}
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          BACKUP_HOUR: ${{ vars.BACKUP_HOUR }}
          BACKUP_KEEP: ${{ vars.BACKUP_KEEP }}
          BACKUP_DIR: ${{ vars.BACKUP_DIR }}
          AGENT_CONTEXT_INSTRUCTIONS: ${{ vars.AGENT_CONTEXT_INSTRUCTIONS }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          MCP_HTTP_TOKEN: ${{ secrets.MCP_HTTP_TOKEN }}
        run: |
          mkdir -p "$DEPLOY_DIR"
          cat > "$DEPLOY_DIR/.env" <<ENVEOF
          BACKEND_PORT=${BACKEND_PORT:-8000}
          FRONTEND_PORT=${FRONTEND_PORT:-80}
          DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
          DB_POOL_SIZE=${DB_POOL_SIZE:-5}
          DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
          DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
          DB_SSL_MODE=${DB_SSL_MODE:-}
          AUTH_PASSWORD=${AUTH_PASSWORD:-}
          AUTH_PROXY_HEADER=${AUTH_PROXY_HEADER:-}
          # The generated compose always puts the frontend's nginx in front of the
          # backend, so one hop is the floor for this topology (ADR-0109). Raise the
          # TRUSTED_PROXY_HOPS variable to 2 if a CDN fronts that nginx. Guessing low
          # is the safe direction: everyone buckets under the proxy and the throttle
          # is merely too strict, where guessing high would let a caller forge theirs.
          TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
          AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL:-604800}
          AUTH_MAX_ATTEMPTS=${AUTH_MAX_ATTEMPTS:-5}
          AUTH_LOCKOUT_SECONDS=${AUTH_LOCKOUT_SECONDS:-300}
          SECRET_KEY=${SECRET_KEY:-}
          CORS_ORIGINS=${CORS_ORIGINS:-}
          SMTP_HOST=${SMTP_HOST:-}
          SMTP_PORT=${SMTP_PORT:-587}
          SMTP_USER=${SMTP_USER:-}
          SMTP_PASS=${SMTP_PASS:-}
          SMTP_FROM=${SMTP_FROM:-}
          SMTP_USE_TLS=${SMTP_USE_TLS:-true}
          LLM_PROVIDER=${LLM_PROVIDER:-stub}
          LLM_API_KEY=${LLM_API_KEY:-}
          LLM_MODEL=${LLM_MODEL:-}
          LLM_BASE_URL=${LLM_BASE_URL:-}
          SUMMARY_HOUR=${SUMMARY_HOUR:-8}
          DIGEST_DAY=${DIGEST_DAY:-1}
          BACKUP_ENABLED=${BACKUP_ENABLED:-1}
          BACKUP_HOUR=${BACKUP_HOUR:-3}
          BACKUP_KEEP=${BACKUP_KEEP:-7}
          BACKUP_DIR=${BACKUP_DIR:-/app/data/backups}
          AGENT_CONTEXT_INSTRUCTIONS=${AGENT_CONTEXT_INSTRUCTIONS:-}
          MCP_API_KEY=${MCP_API_KEY:-}
          MCP_HTTP_TOKEN=${MCP_HTTP_TOKEN:-}
          ENVEOF

          # Refuse to publish an unauthenticated instance. auth_enabled() is
          # `AUTH_PASSWORD or AUTH_PROXY_HEADER` (app/routers/auth.py), and when it is
          # false AuthMiddleware short-circuits and the whole internal /api is served to
          # anyone. Both are empty-by-default so the app degrades open, which is right
          # for `docker compose up` on a laptop and wrong for a public deploy. A missing
          # Gitea secret is silent, so without this check the pipeline would go green
          # having published an open instance.
          if [ -z "${AUTH_PASSWORD:-}" ] && [ -z "${AUTH_PROXY_HEADER:-}" ]; then
            echo "ERROR: neither AUTH_PASSWORD (secret) nor AUTH_PROXY_HEADER (var) is set."
            echo "       Deploying now would publish an instance with no authentication."
            echo "       Set the AUTH_PASSWORD secret, or AUTH_PROXY_HEADER if an SSO proxy fronts this origin (ADR-0030)."
            exit 1
          fi

          # SECRET_KEY signs share-PIN sessions. Unset, share.py falls back to a random
          # per-process secret (and warns), so every restart and every deploy silently
          # invalidates every PIN session. Not fatal — the app works, guests just get
          # asked for the PIN again — so this warns rather than blocks.
          [ -n "${SECRET_KEY:-}" ] || echo "WARNING: SECRET_KEY is not set — share PIN sessions will not survive a restart or a deploy"

          # Whether this deployment serves remote MCP. The backend registers /mcp iff
          # MCP_HTTP_TOKEN is set (ADR-0080), so that secret alone decides — there is no
          # separate service to leave out of the compose file any more. Reported here so
          # the verification step below knows which answer to expect from /mcp.
          if [ -n "${MCP_HTTP_TOKEN:-}" ]; then
            echo "MCP_ENABLED=1" >> $GITHUB_ENV
            echo "Remote MCP: enabled"
            # The token opens the door; the API key is what the tools act with. With one
            # and not the other the endpoint answers and every tool fails against
            # /api/v1 — worth saying out loud rather than leaving to be discovered.
            [ -n "${MCP_API_KEY:-}" ] || echo "WARNING: MCP_HTTP_TOKEN is set but MCP_API_KEY is not — every MCP tool will fail with 401 from /api/v1"
          else
            echo "MCP_ENABLED=0" >> $GITHUB_ENV
            echo "Remote MCP: disabled (set MCP_HTTP_TOKEN to enable; MCP_API_KEY is what its tools act with)"
          fi

      - name: Generate compose file
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > "$DEPLOY_DIR/docker-compose.yml" <<EOF
          services:
            backend:
              image: $IMAGE_PREFIX/backend:$IMAGE_TAG
              container_name: ${REPO_NAME}-backend
              expose:
                - "8000"
              volumes:
                - ./data:/app/data
              environment:
                # Remote MCP is served by this process (ADR-0080). MCP_HTTP_TOKEN comes
                # from .env below and decides whether /mcp exists at all; these two are
                # what its tools act with. API_BASE_URL points back at this same process:
                # the tools stay /api/v1 clients, so the key's scope bounds the endpoint.
                - API_BASE_URL=http://localhost:8000
                - API_KEY=\${MCP_API_KEY}
              env_file:
                - .env
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 10s
              networks:
                - app-network
            frontend:
              image: $IMAGE_PREFIX/frontend:$IMAGE_TAG
              container_name: ${REPO_NAME}-frontend
              ports:
                - "127.0.0.1:\${FRONTEND_PORT:-80}:80"
              depends_on:
                backend:
                  condition: service_healthy
              restart: unless-stopped
              networks:
                - app-network
          EOF

          # No mcp service: remote MCP is a route on the backend now (ADR-0080), reached
          # through the frontend's nginx at https://<host>/mcp. Still exactly one door,
          # like every other public surface here — there is just one less container
          # behind it, and one less thing that can be absent.

          cat >> "$DEPLOY_DIR/docker-compose.yml" <<EOF
          networks:
            app-network:
          EOF

      - name: Persist deploy files to host
        run: |
          cat "$DEPLOY_DIR/.env" | docker run --rm -i -v "${DEPLOY_DIR}:/deploy" docker:27-cli sh -c 'cat > /deploy/.env'
          cat "$DEPLOY_DIR/docker-compose.yml" | docker run --rm -i -v "${DEPLOY_DIR}:/deploy" docker:27-cli sh -c 'cat > /deploy/docker-compose.yml'

      - name: Pull images
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" pull

      # The schema has to reach head before anything serves against it, and exactly once:
      # the lifespan runs per uvicorn worker, so it can create a new schema but must not
      # upgrade an existing one (ADR-0064).
      #
      # Nothing is stopped first. The first version of this step ran `stop backend` here so
      # that no process was reading the database while it was being rewritten — and then the
      # migration refused, the job ended, `up -d` never ran, and production stayed down with
      # its backend stopped. A step that can fail must not be the one holding production
      # open. Leaving the old container running costs a few seconds of old code against a
      # new schema; getting it wrong costs an outage that lasts until a human notices.
      - name: Apply database migrations
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" run --rm --no-deps backend python -m app.db_schema

      - name: Deploy services
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" up -d --remove-orphans

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' $REPO_NAME-backend 2>/dev/null || echo "not found")
            echo "Attempt $i: backend health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker logs $REPO_NAME-backend --tail 50
          exit 1

      - name: Verify frontend
        run: |
          for i in $(seq 1 10); do
            docker exec $REPO_NAME-frontend wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Frontend verification failed"
          docker logs $REPO_NAME-frontend --tail 50
          exit 1

      # Negative control, in both directions. Enabled, the endpoint has to be reachable
      # *and* closed: a 200 would mean the SPA answered its own path with index.html
      # (ADR-0071) or the token check is not running. Disabled, it has to be *absent*:
      # a 404 proves the route was never registered, where the old standalone container
      # could only produce a 502 — an assertion the disabled case never had before.
      - name: Verify the remote MCP endpoint matches its configuration
        run: |
          if [ "$MCP_ENABLED" = "1" ]; then want=401; else want=404; fi
          i=1
          while [ $i -le 15 ]; do
            out=$(docker exec $REPO_NAME-frontend wget -q -O - \
              --header='Content-Type: application/json' --post-data='{}' \
              http://127.0.0.1:80/mcp 2>&1 || true)
            case "$out" in
              *"$want"*) echo "/mcp answered $want, as configured (MCP_ENABLED=$MCP_ENABLED)"; exit 0 ;;
              *502*) echo "Attempt $i: nginx cannot reach the backend yet" ;;
              *) echo "Attempt $i: unexpected response: $out" ;;
            esac
            i=$((i + 1))
            sleep 2
          done
          echo "Remote MCP verification failed: expected $want"
          docker logs $REPO_NAME-backend --tail 50
          exit 1

      - name: Show deployment status
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" ps -a
