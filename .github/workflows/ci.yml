name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run at a time per ref. Without this, pushes stack: every superseded run keeps
# building images and holding containers on a host with 6 CPUs and 8GB shared with
# dev sessions and ~20 unrelated containers, which is the contention the frontend
# job's per-file loop exists to survive. Two orphaned postgres containers from runs
# 436 and 440 were still up seven days later — a cancelled run's `if: always()`
# cleanup does not run when the runner itself is stopped, so overlap leaks resources
# as well as consuming them.
#
# Deploys are not cancelled mid-flight: `cancel-in-progress` is false on main, so a
# run that has begun swapping production containers is allowed to finish and reach
# its health gate rather than being killed between `up -d` and the check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Where these jobs run is a repository variable, not a literal.
#
# This workflow file is read by two different servers: the Gitea instance this repo is
# pushed to, whose runner advertises one label (`ci-builder`), and — since the repo is
# public — GitHub Actions on anybody's fork, where that label does not exist and never
# will. A literal `runs-on: ci-builder` is correct on exactly one of them; on the other
# every job sits queued forever, which is the worst of the two failure modes because a
# contributor sees a pending check rather than an error naming what is wrong.
#
# So the label is `vars.CI_RUNNER` with `ubuntu-latest` as the fallback: a fork needs no
# configuration at all, and this instance sets CI_RUNNER=ci-builder / CD_RUNNER=cd-deployer
# once in its repository variables. Gitea 1.25 evaluates expressions in `runs-on` — this
# was probed against the live runner before being relied on, because if it did not, the
# symptom would again be a queue and not a message.
#
# Publishing and deploying are gated on `vars.REGISTRY_URL` for the same reason from the
# other side: a fork has no registry and no deploy host, and "no registry configured" is
# exactly the condition under which there is nothing to publish. Without that gate a fork
# pushing to its own `main` gets two jobs that can never be scheduled.

jobs:
  # The runner's own housekeeping, before anything asks it for a container.
  #
  # A job's `if: always()` teardown does not run when the runner itself is stopped, so
  # this workflow's cleanup can never be its only one — the header comment above already
  # recorded two orphans surviving a week, and runs 478-483 then leaked a postgres
  # container each. Docker's default address pool is about 31 bridge networks; the ten
  # leaked ones exhausted it, and from then on every job died at `create network` before
  # a single test ran, with a message about subnets that names nothing to do with CI.
  #
  # Its own job, not a step repeated four times, because the four check jobs start in
  # parallel: a sweep inside one of them runs after the other three have already failed
  # to get a network. Everything it touches is age-bounded, so a sweep can never take a
  # live run's resources with it — these jobs finish in minutes, not hours.
  preflight:
    name: Reclaim leaked CI resources
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      # Step-level, not job-level: the check jobs below declare `needs: [preflight]`, and a
      # *skipped* job skips everything that needs it. On an ephemeral hosted runner there is
      # nothing to reclaim anyway — the machine is discarded after the run.
      - name: Remove containers and networks left by earlier runs
        if: ${{ vars.CI_RUNNER != '' }}
        run: |
          set -u
          cutoff=$(date -u -d '3 hours ago' +%s)
          older() { [ "$(date -u -d "$1" +%s)" -lt "$cutoff" ]; }

          for c in $(docker ps -aq --filter 'name=^ci-'); do
            name=$(docker inspect -f '{{.Name}}' "$c" | sed 's|^/||')
            # The runner itself is named ci-builder-01 and must survive its own sweep.
            case "$name" in ci-builder*) continue ;; esac
            if older "$(docker inspect -f '{{.State.StartedAt}}' "$c")"; then
              echo "removing stale container $name"
              docker rm -fv "$c" >/dev/null
            fi
          done

          # Named rather than `network prune`: this host runs a dozen unrelated stacks
          # whose idle networks are not this workflow's to reclaim.
          for n in $(docker network ls --format '{{.Name}}' | grep -E '^ci-' || true); do
            if older "$(docker network inspect -f '{{.Created}}' "$n")"; then
              docker network rm "$n" >/dev/null 2>&1 && echo "removed stale network $n" || true
            fi
          done

          echo "networks in use: $(docker network ls -q | wc -l)"

  # DB-independent backend checks — run once, not per database.
  backend-checks:
    name: Backend checks
    needs: [preflight]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-backend-checks-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml build backend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml run --rm --no-deps backend ruff check app/ tests/

      - name: Format check
        run: docker compose -f docker-compose.ci.yml run --rm --no-deps backend ruff format --check app/ tests/

      - name: Security audit
        run: docker compose -f docker-compose.ci.yml run --rm --no-deps backend sh -c "pip install pip-audit && pip-audit --strict"

      # No separate MCP image or suite: the server is a module inside the backend
      # package now (ADR-0080), so `tests/test_mcp_server.py` runs in the backend
      # test jobs below — against both databases rather than once here.

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
          docker image prune -f

  # The two databases are first-class, symmetric test targets: same suite,
  # same coverage gate. Neither is primary. See ADR-0018 / ADR-0020.
  backend-sqlite:
    name: Backend tests (SQLite)
    needs: [preflight]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-backend-sqlite-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml build backend

      - name: Run tests with coverage
        run: |
          docker compose -f docker-compose.ci.yml run --rm --no-deps \
            -e TEST_DATABASE_URL=sqlite:///:memory: \
            backend pytest tests/ -v --tb=short --cov --cov-report=term-missing

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
          docker image prune -f

  backend-postgres:
    name: Backend tests (PostgreSQL)
    needs: [preflight]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-backend-pg-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml --profile pgtest build backend

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.ci.yml --profile pgtest up -d postgres

      - name: Wait for PostgreSQL health
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml --profile pgtest exec -T postgres \
              pg_isready -U todo -d shard_test 2>/dev/null && exit 0
            sleep 2
          done
          echo "PostgreSQL failed to become healthy"
          docker compose -f docker-compose.ci.yml --profile pgtest logs postgres
          exit 1

      - name: Run tests with coverage
        run: |
          docker compose -f docker-compose.ci.yml --profile pgtest run --rm --no-deps \
            -e TEST_DATABASE_URL=postgresql+psycopg://todo:todo_dev@postgres:5432/shard_test \
            backend pytest tests/ -v --tb=short --cov --cov-report=term-missing

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml --profile pgtest down -v
          docker image prune -f

  frontend:
    name: Frontend tests
    needs: [preflight]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-frontend-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build frontend image
        run: docker compose -f docker-compose.ci.yml build frontend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml run --rm frontend npm run lint -- --max-warnings 10

      # One `vitest run` process per file, not one process for the whole suite.
      # A single long-lived worker running the whole suite eventually OOMs, and
      # not because of a leak in the tests: a run using one fresh process *per
      # file* - zero state carried from any prior file, so nothing to accumulate -
      # still hit the same wall, on a file that had passed clean in isolation
      # every time it was tested alone. The crash site also moves between runs
      # with no fixed boundary. Both rule out the test suite: this is contention
      # for the shared runner host's memory from whatever else is on it at the
      # moment, not something a vitest/CI setting can fix away. Splitting the
      # process per file keeps a bad moment's damage to one file - retry that
      # file, not the whole suite - which is the most this can promise.
      #
      # The container is created once; each file gets its own `vitest run`
      # invocation inside it, so steady-state cost is Node's startup time per
      # file, not Docker's. One retry on a lone failing file absorbs a host
      # squeezed at the wrong instant without masking a real test failure - a
      # file with an actual assertion failure fails the same way twice.
      - name: Run tests
        run: |
          docker compose -f docker-compose.ci.yml run --rm frontend sh -c '
            set -e
            for f in $(find src \( -name "*.test.js" -o -name "*.test.jsx" \)); do
              echo "== $f =="
              npx vitest run "$f" || { echo "-- retrying $f --"; npx vitest run "$f"; }
            done
          '

      # `high`, not `moderate` (ADR-0145). A moderate advisory whose only fix is a major
      # upgrade blocks every deploy until somebody does that upgrade, and the pressure to
      # do it lands on whoever is trying to ship something unrelated. That is what
      # happened: 27 moderate tiptap advisories, all fixable only by 2.x -> 3.x, arrived
      # between two pushes and stopped production deploying. Moderates are still reported
      # in this step's output; they no longer gate. Reviewing them is a person's job now,
      # which is the cost this threshold buys and the reason it is written down.
      - name: Security audit
        run: docker compose -f docker-compose.ci.yml run --rm frontend npm audit --audit-level=high

      - name: Build
        run: docker compose -f docker-compose.ci.yml run --rm frontend npx vite build

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v
          docker image prune -f

  integration:
    name: Integration smoke test (prod)
    needs: [backend-checks, backend-sqlite, backend-postgres, frontend]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Isolate this run's compose project
        run: echo "COMPOSE_PROJECT_NAME=ci-integration-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Build production images
        run: docker compose -f docker-compose.ci.yml --profile integration build backend-prod frontend-prod

      - name: Start services
        run: docker compose -f docker-compose.ci.yml --profile integration up -d backend-prod frontend-prod

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml --profile integration exec backend-prod \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker compose -f docker-compose.ci.yml --profile integration logs backend-prod
          exit 1

      # scripts/check_api_docs.py compares docs/api.md against the *running* app's
      # OpenAPI spec in both directions. It was written, works, and was wired to
      # nothing — 99 of 320 live routes had no entry by the time anyone ran it, and
      # four documented routes no longer existed. This job already has a healthy
      # backend, so the check costs one step.
      #
      # It ratchets rather than gates on the whole debt: the known-undocumented set is
      # frozen in the script, and the check fails on anything outside it — new drift,
      # a documented route that stopped existing, or a baseline entry that got written
      # up without being removed from the list.
      # Runs inside backend-prod, not on the runner: the runner has no Python of its
      # own and the project rule is that every step runs in a container. The image
      # carries the app but not the repo's docs/, so the two inputs are copied in.
      - name: Check the API docs against the running app
        run: |
          CID=$(docker compose -f docker-compose.ci.yml --profile integration ps -q backend-prod)
          docker cp scripts/check_api_docs.py "$CID:/tmp/check_api_docs.py"
          docker cp docs/api.md "$CID:/tmp/api.md"
          docker exec "$CID" python /tmp/check_api_docs.py http://localhost:8000/openapi.json /tmp/api.md

      # The other direction: a URL the project publishes has to be a route the app has.
      # `/app` answered 200 for two months after the routes moved to `/` — nginx serves
      # index.html for any SPA path, so the shell rendered and the content was blank,
      # in every doc, the setup script, and every e2e test at once.
      - name: Check the documented URLs against the route table
        run: |
          CID=$(docker compose -f docker-compose.ci.yml --profile integration ps -q backend-prod)
          docker exec "$CID" mkdir -p /tmp/urlcheck
          tar cf - scripts/check_documented_urls.py frontend/src/App.jsx e2e/tests \
            README.md CLAUDE.md .github/CONTRIBUTING.md docs/local-setup.md docs/deployment.md scripts/setup.sh \
            | docker exec -i "$CID" tar xf - -C /tmp/urlcheck
          docker exec "$CID" python /tmp/urlcheck/scripts/check_documented_urls.py /tmp/urlcheck

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$COMPOSE_PROJECT_NAME-frontend-prod-1" 2>/dev/null || echo "not found")
            echo "Attempt $i: frontend-prod health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Frontend health check failed"
          docker compose -f docker-compose.ci.yml --profile integration logs frontend-prod
          exit 1

      - name: Smoke test frontend
        run: |
          docker compose -f docker-compose.ci.yml --profile integration exec frontend-prod \
            wget -qO- http://127.0.0.1/ > /dev/null

      - name: Build e2e image
        run: docker compose -f docker-compose.ci.yml --profile integration build e2e

      # e2e/ was covered by neither audit: the backend job runs pip-audit and the
      # frontend job runs npm audit, and this third package.json belonged to neither.
      - name: Security audit (e2e)
        # Same threshold as the frontend's, for ADR-0145's reason. This tree is clean at
        # `moderate` today; leaving the two gates on different thresholds is how the next
        # advisory wave reproduces the same outage in the one that was not changed.
        run: docker compose -f docker-compose.ci.yml --profile integration run --rm --no-deps e2e npm audit --audit-level=high

      - name: Run Playwright e2e suite
        run: |
          docker compose -f docker-compose.ci.yml --profile integration \
            run --rm --no-deps e2e npx playwright test --reporter=line

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml --profile integration down -v
          docker image prune -f
          docker builder prune -f --filter until=48h

  # Install the way the README says a stranger does, and prove it comes up.
  #
  # ADR-0138: `git clone && docker compose -f docker-compose.selfhost.yml up -d` had
  # been broken since ADR-0117 shipped and nothing noticed for months, because the
  # only machine it was ever run on had `./data` and `./uploads` lying around from the
  # dev stack. Every other check in this workflow runs against a compose file with no
  # bind mounts, so none of them could have caught it.
  #
  # The tree is copied to an absolute host path through a helper container — the move
  # the deploy job makes for `$DEPLOY_DIR` — because this job talks to the host's Docker
  # daemon, and the compose file's `build:` contexts are resolved by that daemon, not
  # here. The data itself is in named volumes now (ADR-0139), so nothing depends on who
  # owns the copied tree.
  selfhost-install:
    name: Self-host install from a clean tree
    needs: [backend-checks, backend-sqlite, backend-postgres, frontend]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Name this run's compose project
        run: echo "SELFHOST_PROJECT=ci-selfhost-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      # Not about this job's stack — about the *dev* one, which still bind-mounts ./data
      # and is the only place left that can hit ADR-0138. It is asserted here because
      # this is the job that knows why the directory is tracked.
      - name: The tree still carries the dev stack's mount point
        run: |
          test -d data || {
            echo "data/ is missing from the checkout."
            echo "The dev stack bind-mounts it, so Compose would have the daemon create it as root,"
            echo "and the backend runs as uid 1000. It is tracked via .gitkeep on purpose — ADR-0138."
            exit 1
          }

      # This job used to copy the checkout to a host path and run compose against *that*,
      # because the runner is docker-out-of-docker. Only a bind mount needs the daemon's
      # filesystem, and ADR-0139 took the bind mounts out of this stack — named volumes
      # and relative build contexts are both resolved by the client. So the copy had
      # nothing left to do except put the compose file somewhere this job cannot read,
      # and `docker compose -f` opens that file locally: the job failed on every run from
      # the day ADR-0139 shipped (ADR-0144). Asserted rather than assumed, because the
      # copy step's failure mode was silence.
      - name: The compose file is readable from where compose runs
        run: |
          test -f docker-compose.selfhost.yml && test -d backend && test -d frontend || {
            echo "the checkout is not what compose is about to read — ADR-0144"
            exit 1
          }

      # The documented command, verbatim, run from the checkout, which is where somebody
      # who just cloned this runs it. It builds from source: what a person with no
      # registry account gets. `-p` is the one divergence, so two runs cannot collide and
      # so Cleanup removes this run's volumes and no one else's.
      - name: docker compose up
        run: |
          printf 'FRONTEND_PORT=8099\n' > .env
          docker compose -f docker-compose.selfhost.yml -p "$SELFHOST_PROJECT" up -d --build

      - name: The backend is healthy
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.selfhost.yml -p "$SELFHOST_PROJECT" \
              exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null && exit 0
            sleep 2
          done
          echo "the self-host stack never became healthy"
          docker compose -f docker-compose.selfhost.yml -p "$SELFHOST_PROJECT" logs backend
          exit 1

      # Through nginx, so this covers the half a health check cannot: the SPA is served
      # and its API calls are proxied to the backend.
      - name: The frontend serves the app and proxies the API
        run: |
          compose() { docker compose -f docker-compose.selfhost.yml -p "$SELFHOST_PROJECT" "$@"; }
          # 127.0.0.1, not localhost: nginx listens on 0.0.0.0:80 only, and busybox wget
          # tries ::1 first, which answers "connection refused" and reads like a dead server.
          compose exec -T frontend wget -q -O - http://127.0.0.1/ | grep -q '<div id="root"' \
            || { echo "nginx did not serve the SPA"; compose logs frontend; exit 1; }
          compose exec -T frontend wget -q -O - http://127.0.0.1/api/settings | grep -q '"version"' \
            || { echo "nginx did not proxy /api to the backend"; compose logs frontend backend; exit 1; }

      # The app wrote its own database, as itself. A health check only reads, so without
      # this the failure ADR-0138 describes could come back as a stack that comes up
      # green and dies on the first write — the state the deploy job's chown step exists
      # to prevent. Under ADR-0139 the volume is seeded from the image, so uid 1000 is
      # what a correct setup looks like on every host.
      - name: The database belongs to the app user
        run: |
          owner=$(docker compose -f docker-compose.selfhost.yml -p "$SELFHOST_PROJECT" \
            exec -T backend stat -c %u /app/data/shard.db | tr -d '\r')
          test "$owner" = "1000" || { echo "/app/data/shard.db is owned by uid $owner, expected 1000"; exit 1; }

      # The whole point of a volume: the containers are disposable and the data is not.
      # `down` without -v keeps the volumes, which is also what an upgrade does.
      - name: The data survives the containers
        run: |
          compose() { docker compose -f docker-compose.selfhost.yml -p "$SELFHOST_PROJECT" "$@"; }
          compose down
          compose up -d
          compose exec -T backend test -f /app/data/shard.db \
            || { echo "the database did not survive a down/up — the volume is not persisting"; exit 1; }

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.selfhost.yml -p "$SELFHOST_PROJECT" down -v || true
          docker image prune -f

  publish:
    name: Publish Docker images
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.REGISTRY_URL != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      # The backend and frontend steps only re-tag images the integration job
      # left on the runner, so this job used to need no source at all. Building
      # the MCP image here does need it — without the checkout the compose file
      # is missing and publish fails *after* pushing backend and frontend, which
      # takes the deploy down with it.
      - uses: actions/checkout@v4

      - name: Login to registry
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Compute image prefix
        run: echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Compose names a built image `<project>-<service>`, and the integration job's
      # project is now per-run. Without this, two overlapping runs both produced
      # `ci-integration-backend-prod:latest` and publish could push the *other*
      # run's image — the wrong artifact reaching production, silently.
      - name: Name the images the integration job built
        run: echo "INTEGRATION_PROJECT=ci-integration-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Tag and push backend
        run: |
          docker tag $INTEGRATION_PROJECT-backend-prod:latest $IMAGE_PREFIX/backend:${{ github.sha }}
          docker tag $INTEGRATION_PROJECT-backend-prod:latest $IMAGE_PREFIX/backend:latest
          docker push $IMAGE_PREFIX/backend:${{ github.sha }}
          docker push $IMAGE_PREFIX/backend:latest

      - name: Tag and push frontend
        run: |
          docker tag $INTEGRATION_PROJECT-frontend-prod:latest $IMAGE_PREFIX/frontend:${{ github.sha }}
          docker tag $INTEGRATION_PROJECT-frontend-prod:latest $IMAGE_PREFIX/frontend:latest
          docker push $IMAGE_PREFIX/frontend:${{ github.sha }}
          docker push $IMAGE_PREFIX/frontend:latest

      # No MCP image to build: the server is a module inside the backend package
      # (ADR-0080), so a deployment that enables remote MCP runs the backend image
      # with a different command. One build context, one image.


  # Public images, so a self-hoster pulls a build instead of spending ten minutes
  # making their own (ADR-0137). Same artifacts the integration job just proved:
  # re-tagged, never rebuilt, because a second build is a second thing to trust.
  #
  # Its own job, and nothing depends on it. Shipped as a second half of `publish` it
  # took the deploy down with it the first time the Docker Hub token turned out to be
  # read-only: production went un-deployed because an optional convenience failed. A
  # public image is worth a red job of its own, not a blocked release.
  publish-public:
    name: Publish public images
    needs: [integration, selfhost-install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLIC_REGISTRY_URL != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      # For backend/pyproject.toml, which is where the version comes from.
      - uses: actions/checkout@v4

      - name: Name the images the integration job built
        run: echo "INTEGRATION_PROJECT=ci-integration-${GITHUB_RUN_ID:?no run id in the environment}" >> $GITHUB_ENV

      - name: Login to the public registry
        env:
          PUBLIC_REGISTRY_URL: ${{ vars.PUBLIC_REGISTRY_URL }}
          PUBLIC_REGISTRY_USERNAME: ${{ vars.PUBLIC_REGISTRY_USERNAME }}
          PUBLIC_REGISTRY_TOKEN: ${{ secrets.PUBLIC_REGISTRY_TOKEN }}
        run: echo "$PUBLIC_REGISTRY_TOKEN" | docker login "$PUBLIC_REGISTRY_URL" -u "$PUBLIC_REGISTRY_USERNAME" --password-stdin

      - name: Publish public images
        env:
          PUBLIC_REGISTRY_URL: ${{ vars.PUBLIC_REGISTRY_URL }}
          PUBLIC_REGISTRY_NAMESPACE: ${{ vars.PUBLIC_REGISTRY_NAMESPACE }}
        run: |
          set -eu
          # Docker Hub has no nested repository paths — `ns/shard/backend` is not a name
          # it can hold — so the public images are flat: `<ns>/shard-backend`. Any other
          # registry keeps its host in front. The `publish` job's private registry is
          # untouched by this and keeps its own three-level prefix.
          case "$PUBLIC_REGISTRY_URL" in
            docker.io) PREFIX="$PUBLIC_REGISTRY_NAMESPACE/shard" ;;
            *)         PREFIX="$PUBLIC_REGISTRY_URL/$PUBLIC_REGISTRY_NAMESPACE/shard" ;;
          esac

          # The version comes from the file that declares it (ADR-0136), so bumping
          # `backend/pyproject.toml` is what cuts a release.
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -1)
          echo "publishing $PREFIX-{backend,frontend}:$VERSION and :latest"

          for svc in backend frontend; do
            src="$INTEGRATION_PROJECT-$svc-prod:latest"

            docker tag "$src" "$PREFIX-$svc:latest"
            docker push "$PREFIX-$svc:latest"

            # A version tag is immutable: once `1.0.0` is published it names one build
            # forever, so a later push to main moves `latest` and leaves it alone. Without
            # this, every merge would silently replace what somebody pinned.
            if docker manifest inspect "$PREFIX-$svc:$VERSION" >/dev/null 2>&1; then
              echo "$PREFIX-$svc:$VERSION is already published — leaving it; bump the version to cut a new one"
            else
              docker tag "$src" "$PREFIX-$svc:$VERSION"
              docker push "$PREFIX-$svc:$VERSION"
            fi
          done

  deploy:
    name: Deploy to production
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.REGISTRY_URL != ''
    runs-on: ${{ vars.CD_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        shell: sh
    steps:
      - name: Login to registry
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Compute deploy variables
        env:
          CUSTOM_DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "DEPLOY_DIR=${CUSTOM_DEPLOY_DIR:-/opt/deployments/$REPO_NAME}" >> $GITHUB_ENV

      - name: Write .env file
        env:
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
          DB_MAX_OVERFLOW: ${{ vars.DB_MAX_OVERFLOW }}
          DB_POOL_TIMEOUT: ${{ vars.DB_POOL_TIMEOUT }}
          DB_SSL_MODE: ${{ vars.DB_SSL_MODE }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          AUTH_PROXY_HEADER: ${{ vars.AUTH_PROXY_HEADER }}
          TRUSTED_PROXY_HOPS: ${{ vars.TRUSTED_PROXY_HOPS }}
          AUTH_TOKEN_TTL: ${{ vars.AUTH_TOKEN_TTL }}
          AUTH_MAX_ATTEMPTS: ${{ vars.AUTH_MAX_ATTEMPTS }}
          AUTH_LOCKOUT_SECONDS: ${{ vars.AUTH_LOCKOUT_SECONDS }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
          DIGEST_DAY: ${{ vars.DIGEST_DAY }}
          BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }}
          BACKUP_HOUR: ${{ vars.BACKUP_HOUR }}
          BACKUP_KEEP: ${{ vars.BACKUP_KEEP }}
          BACKUP_DIR: ${{ vars.BACKUP_DIR }}
          AGENT_CONTEXT_INSTRUCTIONS: ${{ vars.AGENT_CONTEXT_INSTRUCTIONS }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          MCP_HTTP_TOKEN: ${{ secrets.MCP_HTTP_TOKEN }}
        run: |
          mkdir -p "$DEPLOY_DIR"
          cat > "$DEPLOY_DIR/.env" <<ENVEOF
          BACKEND_PORT=${BACKEND_PORT:-8000}
          FRONTEND_PORT=${FRONTEND_PORT:-80}
          DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
          DB_POOL_SIZE=${DB_POOL_SIZE:-5}
          DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
          DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
          DB_SSL_MODE=${DB_SSL_MODE:-}
          AUTH_PASSWORD=${AUTH_PASSWORD:-}
          AUTH_PROXY_HEADER=${AUTH_PROXY_HEADER:-}
          # The generated compose always puts the frontend's nginx in front of the
          # backend, so one hop is the floor for this topology (ADR-0109). Raise the
          # TRUSTED_PROXY_HOPS variable to 2 if a CDN fronts that nginx. Guessing low
          # is the safe direction: everyone buckets under the proxy and the throttle
          # is merely too strict, where guessing high would let a caller forge theirs.
          TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
          AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL:-604800}
          AUTH_MAX_ATTEMPTS=${AUTH_MAX_ATTEMPTS:-5}
          AUTH_LOCKOUT_SECONDS=${AUTH_LOCKOUT_SECONDS:-300}
          SECRET_KEY=${SECRET_KEY:-}
          CORS_ORIGINS=${CORS_ORIGINS:-}
          SMTP_HOST=${SMTP_HOST:-}
          SMTP_PORT=${SMTP_PORT:-587}
          SMTP_USER=${SMTP_USER:-}
          SMTP_PASS=${SMTP_PASS:-}
          SMTP_FROM=${SMTP_FROM:-}
          SMTP_USE_TLS=${SMTP_USE_TLS:-true}
          LLM_PROVIDER=${LLM_PROVIDER:-stub}
          LLM_API_KEY=${LLM_API_KEY:-}
          LLM_MODEL=${LLM_MODEL:-}
          LLM_BASE_URL=${LLM_BASE_URL:-}
          SUMMARY_HOUR=${SUMMARY_HOUR:-8}
          DIGEST_DAY=${DIGEST_DAY:-1}
          BACKUP_ENABLED=${BACKUP_ENABLED:-1}
          BACKUP_HOUR=${BACKUP_HOUR:-3}
          BACKUP_KEEP=${BACKUP_KEEP:-7}
          BACKUP_DIR=${BACKUP_DIR:-/app/data/backups}
          AGENT_CONTEXT_INSTRUCTIONS=${AGENT_CONTEXT_INSTRUCTIONS:-}
          MCP_API_KEY=${MCP_API_KEY:-}
          MCP_HTTP_TOKEN=${MCP_HTTP_TOKEN:-}
          ENVEOF

          # Refuse to publish an unauthenticated instance. auth_enabled() is
          # `AUTH_PASSWORD or AUTH_PROXY_HEADER` (app/routers/auth.py), and when it is
          # false AuthMiddleware short-circuits and the whole internal /api is served to
          # anyone. Both are empty-by-default so the app degrades open, which is right
          # for `docker compose up` on a laptop and wrong for a public deploy. A missing
          # Gitea secret is silent, so without this check the pipeline would go green
          # having published an open instance.
          if [ -z "${AUTH_PASSWORD:-}" ] && [ -z "${AUTH_PROXY_HEADER:-}" ]; then
            echo "ERROR: neither AUTH_PASSWORD (secret) nor AUTH_PROXY_HEADER (var) is set."
            echo "       Deploying now would publish an instance with no authentication."
            echo "       Set the AUTH_PASSWORD secret, or AUTH_PROXY_HEADER if an SSO proxy fronts this origin (ADR-0030)."
            exit 1
          fi

          # SECRET_KEY signs share-PIN sessions. Unset, share.py falls back to a random
          # per-process secret (and warns), so every restart and every deploy silently
          # invalidates every PIN session. Not fatal — the app works, guests just get
          # asked for the PIN again — so this warns rather than blocks.
          [ -n "${SECRET_KEY:-}" ] || echo "WARNING: SECRET_KEY is not set — share PIN sessions will not survive a restart or a deploy"

          # Whether this deployment serves remote MCP. The backend registers /mcp iff
          # MCP_HTTP_TOKEN is set (ADR-0080), so that secret alone decides — there is no
          # separate service to leave out of the compose file any more. Reported here so
          # the verification step below knows which answer to expect from /mcp.
          if [ -n "${MCP_HTTP_TOKEN:-}" ]; then
            echo "MCP_ENABLED=1" >> $GITHUB_ENV
            echo "Remote MCP: enabled"
            # The token opens the door; the API key is what the tools act with. With one
            # and not the other the endpoint answers and every tool fails against
            # /api/v1 — worth saying out loud rather than leaving to be discovered.
            [ -n "${MCP_API_KEY:-}" ] || echo "WARNING: MCP_HTTP_TOKEN is set but MCP_API_KEY is not — every MCP tool will fail with 401 from /api/v1"
          else
            echo "MCP_ENABLED=0" >> $GITHUB_ENV
            echo "Remote MCP: disabled (set MCP_HTTP_TOKEN to enable; MCP_API_KEY is what its tools act with)"
          fi

      - name: Generate compose file
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > "$DEPLOY_DIR/docker-compose.yml" <<EOF
          services:
            backend:
              image: $IMAGE_PREFIX/backend:$IMAGE_TAG
              container_name: ${REPO_NAME}-backend
              expose:
                - "8000"
              volumes:
                - ./data:/app/data
                # Attachments are state too. Without this, UPLOAD_DIR defaults to
                # /app/uploads *inside* the container and every deploy silently threw
                # the files away — the dev stack only kept them because it binds the
                # source over /app, which this image deliberately does not. The chown
                # step below has been creating this directory on the host all along.
                - ./uploads:/app/uploads
              environment:
                # Remote MCP is served by this process (ADR-0080). MCP_HTTP_TOKEN comes
                # from .env below and decides whether /mcp exists at all; these two are
                # what its tools act with. API_BASE_URL points back at this same process:
                # the tools stay /api/v1 clients, so the key's scope bounds the endpoint.
                - API_BASE_URL=http://localhost:8000
                - API_KEY=\${MCP_API_KEY}
              env_file:
                - .env
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 10s
              networks:
                - app-network
            frontend:
              image: $IMAGE_PREFIX/frontend:$IMAGE_TAG
              container_name: ${REPO_NAME}-frontend
              ports:
                - "127.0.0.1:\${FRONTEND_PORT:-80}:80"
              depends_on:
                backend:
                  condition: service_healthy
              restart: unless-stopped
              networks:
                - app-network
          EOF

          # No mcp service: remote MCP is a route on the backend now (ADR-0080), reached
          # through the frontend's nginx at https://<host>/mcp. Still exactly one door,
          # like every other public surface here — there is just one less container
          # behind it, and one less thing that can be absent.

          cat >> "$DEPLOY_DIR/docker-compose.yml" <<EOF
          networks:
            app-network:
          EOF

      - name: Persist deploy files to host
        run: |
          cat "$DEPLOY_DIR/.env" | docker run --rm -i -v "${DEPLOY_DIR}:/deploy" docker:27-cli sh -c 'cat > /deploy/.env'
          cat "$DEPLOY_DIR/docker-compose.yml" | docker run --rm -i -v "${DEPLOY_DIR}:/deploy" docker:27-cli sh -c 'cat > /deploy/docker-compose.yml'

      # The backend image runs as uid 1000 now, and ./data is a host bind — so its
      # ownership decides whether the app can write its own database. Every deploy
      # before this one ran as root and left root-owned files there; without this the
      # first non-root deploy comes up healthy (the health check only reads) and then
      # fails on the first write. Idempotent, and cheap enough to keep running.
      - name: Ensure the data directory is writable by the app user
        run: |
          docker run --rm -v "${DEPLOY_DIR}:/deploy" alpine:3.20 \
            sh -c 'mkdir -p /deploy/data /deploy/uploads && chown -R 1000:1000 /deploy/data /deploy/uploads'

      - name: Pull images
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" pull

      # The schema has to reach head before anything serves against it, and exactly once:
      # the lifespan runs per uvicorn worker, so it can create a new schema but must not
      # upgrade an existing one (ADR-0064).
      #
      # Nothing is stopped first. The first version of this step ran `stop backend` here so
      # that no process was reading the database while it was being rewritten — and then the
      # migration refused, the job ended, `up -d` never ran, and production stayed down with
      # its backend stopped. A step that can fail must not be the one holding production
      # open. Leaving the old container running costs a few seconds of old code against a
      # new schema; getting it wrong costs an outage that lasts until a human notices.
      # A migration is the one step here that cannot be undone by re-pulling an older
      # image. Alembic gets no snapshot from anywhere else — the app's own daily backup
      # (ADR-0013) runs on the scheduler's clock, not the deploy's — so a revision that
      # half-applies leaves nothing to go back to. Copying the data directory takes a
      # second and is the difference between a bad revision costing a restore and
      # costing the database.
      #
      # Never fails the deploy: if there is nothing to copy (a fresh host, or an
      # external DATABASE_URL where ./data holds no database) that is not a reason to
      # refuse to deploy. It reports what it did and moves on.
      - name: Snapshot the data directory before migrating
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          SNAP="$DEPLOY_DIR/pre-deploy-backups/$STAMP-${GITHUB_SHA}"
          if [ -d "$DEPLOY_DIR/data" ]; then
            mkdir -p "$SNAP"
            cp -a "$DEPLOY_DIR/data/." "$SNAP/" 2>/dev/null || true
            echo "Snapshot: $SNAP"
            # Keep the last 5. A snapshot per deploy fills a small host otherwise.
            ls -1dt "$DEPLOY_DIR"/pre-deploy-backups/*/ 2>/dev/null | tail -n +6 | xargs -r rm -rf
          else
            echo "No $DEPLOY_DIR/data to snapshot (external database, or first deploy) — skipping."
          fi

      - name: Apply database migrations
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" run --rm --no-deps backend python -m app.db_schema

      # Record what is serving *now*, before it is replaced. Read from the running
      # container rather than assumed, so a rollback returns to what was actually up
      # even if a previous deploy failed partway.
      - name: Note the currently deployed image
        run: |
          PREV=$(docker inspect --format='{{.Config.Image}}' "$REPO_NAME-backend" 2>/dev/null || echo "")
          PREV_FE=$(docker inspect --format='{{.Config.Image}}' "$REPO_NAME-frontend" 2>/dev/null || echo "")
          echo "PREV_BACKEND_IMAGE=$PREV" >> $GITHUB_ENV
          echo "PREV_FRONTEND_IMAGE=$PREV_FE" >> $GITHUB_ENV
          echo "Currently serving: backend=${PREV:-none} frontend=${PREV_FE:-none}"

      - name: Deploy services
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" up -d --remove-orphans

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' $REPO_NAME-backend 2>/dev/null || echo "not found")
            echo "Attempt $i: backend health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker logs $REPO_NAME-backend --tail 50
          exit 1

      - name: Verify frontend
        run: |
          for i in $(seq 1 10); do
            docker exec $REPO_NAME-frontend wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Frontend verification failed"
          docker logs $REPO_NAME-frontend --tail 50
          exit 1

      # Negative control, in both directions. Enabled, the endpoint has to be reachable
      # *and* closed: a 200 would mean the SPA answered its own path with index.html
      # (ADR-0071) or the token check is not running. Disabled, it has to be *absent*:
      # a 404 proves the route was never registered, where the old standalone container
      # could only produce a 502 — an assertion the disabled case never had before.
      - name: Verify the remote MCP endpoint matches its configuration
        run: |
          if [ "$MCP_ENABLED" = "1" ]; then want=401; else want=404; fi
          i=1
          while [ $i -le 15 ]; do
            out=$(docker exec $REPO_NAME-frontend wget -q -O - \
              --header='Content-Type: application/json' --post-data='{}' \
              http://127.0.0.1:80/mcp 2>&1 || true)
            case "$out" in
              *"$want"*) echo "/mcp answered $want, as configured (MCP_ENABLED=$MCP_ENABLED)"; exit 0 ;;
              *502*) echo "Attempt $i: nginx cannot reach the backend yet" ;;
              *) echo "Attempt $i: unexpected response: $out" ;;
            esac
            i=$((i + 1))
            sleep 2
          done
          echo "Remote MCP verification failed: expected $want"
          docker logs $REPO_NAME-backend --tail 50
          exit 1

      # Every check above this point runs *after* `up -d` has already replaced the
      # running containers, so failing them means production is down right now. The
      # job used to simply exit 1 there and leave it down until somebody noticed.
      # Images are tagged by sha, so the previous version is still on this host.
      #
      # This does not undo the migration. A revision that the old code cannot read is
      # exactly the case the pre-deploy snapshot exists for, and restoring a database
      # is not something to do unattended — so this reports loudly rather than
      # guessing. Rolling the images back is still right: a backend that starts is a
      # better place to debug from than one that does not.
      - name: Roll back to the previous images
        if: failure()
        run: |
          if [ -z "${PREV_BACKEND_IMAGE:-}" ]; then
            echo "No previous image recorded — nothing to roll back to (first deploy?)."
            echo "Production may be down. Check the logs above."
            exit 1
          fi

          echo "Deploy failed. Rolling back to:"
          echo "  backend=$PREV_BACKEND_IMAGE"
          echo "  frontend=$PREV_FRONTEND_IMAGE"

          sed -i \
            -e "s|image: $IMAGE_PREFIX/backend:.*|image: $PREV_BACKEND_IMAGE|" \
            -e "s|image: $IMAGE_PREFIX/frontend:.*|image: $PREV_FRONTEND_IMAGE|" \
            "$DEPLOY_DIR/docker-compose.yml"
          docker compose -f "$DEPLOY_DIR/docker-compose.yml" up -d --remove-orphans

          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' $REPO_NAME-backend 2>/dev/null || echo "not found")
            echo "Rollback attempt $i: backend health=$status"
            if [ "$status" = "healthy" ]; then
              echo "Rolled back and healthy."
              echo "NOTE: the schema was migrated and has NOT been reverted. If the old"
              echo "      code cannot read it, restore from $DEPLOY_DIR/pre-deploy-backups."
              exit 1
            fi
            sleep 2
          done

          echo "Rollback did not become healthy either — production is down."
          docker logs $REPO_NAME-backend --tail 50
          exit 1

      - name: Show deployment status
        if: always()
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" ps -a
