name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose build backend

      - name: Lint
        run: docker compose run --rm --no-deps backend ruff check app/ tests/

      - name: Format check
        run: docker compose run --rm --no-deps backend ruff format --check app/ tests/

      - name: Run tests with coverage
        run: docker compose run --rm --no-deps backend pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Security audit
        run: docker compose run --rm --no-deps backend sh -c "pip install pip-audit && pip-audit --strict"

      - name: Cleanup
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend tests
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker compose build frontend

      - name: Lint
        run: docker compose run --rm --no-deps frontend npm run lint -- --max-warnings 300

      - name: Run tests
        run: docker compose run --rm --no-deps frontend npx vitest run

      - name: Security audit
        run: docker compose run --rm --no-deps frontend npm audit --audit-level=moderate

      - name: Build
        run: docker compose run --rm --no-deps frontend npx vite build

      - name: Cleanup
        if: always()
        run: docker compose down -v

  integration:
    name: Integration smoke test (prod)
    needs: [backend, frontend]
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs backend
          exit 1

      - name: Smoke test frontend
        run: curl -sf http://localhost:80/ > /dev/null

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v
