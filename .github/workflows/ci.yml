name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker compose -f docker-compose.ci.yml -p ci-backend build backend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml -p ci-backend run --rm backend ruff check app/ tests/

      - name: Format check
        run: docker compose -f docker-compose.ci.yml -p ci-backend run --rm backend ruff format --check app/ tests/

      - name: Run tests with coverage
        run: docker compose -f docker-compose.ci.yml -p ci-backend run --rm backend pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Security audit
        run: docker compose -f docker-compose.ci.yml -p ci-backend run --rm backend sh -c "pip install pip-audit && pip-audit --strict"

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml -p ci-backend down -v

  frontend:
    name: Frontend tests
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker compose -f docker-compose.ci.yml -p ci-frontend build frontend

      - name: Lint
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npm run lint -- --max-warnings 300

      - name: Run tests
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npx vitest run

      - name: Security audit
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npm audit --audit-level=moderate

      - name: Build
        run: docker compose -f docker-compose.ci.yml -p ci-frontend run --rm frontend npx vite build

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml -p ci-frontend down -v

  integration:
    name: Integration smoke test (prod)
    needs: [backend, frontend]
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - name: Build production images
        run: docker compose -f docker-compose.ci.yml -p ci-integration --profile integration build backend-prod frontend-prod

      - name: Start services
        run: docker compose -f docker-compose.ci.yml -p ci-integration --profile integration up -d backend-prod frontend-prod

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.ci.yml -p ci-integration --profile integration exec backend-prod \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" 2>/dev/null && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration logs backend-prod
          exit 1

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ci-integration-frontend-prod-1 2>/dev/null || echo "not found")
            echo "Attempt $i: frontend-prod health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Frontend health check failed"
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration logs frontend-prod
          exit 1

      - name: Smoke test frontend
        run: |
          docker compose -f docker-compose.ci.yml -p ci-integration --profile integration exec frontend-prod \
            wget -qO- http://127.0.0.1/ > /dev/null

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml -p ci-integration --profile integration down -v

  publish:
    name: Publish Docker images
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ci-builder
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Compute image prefix
        run: echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/frontend:latest

  deploy:
    name: Deploy to production
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: cd-deployer
    defaults:
      run:
        shell: sh
    steps:
      - name: Login to registry
        env:
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_URL" -u "$REGISTRY_USERNAME" --password-stdin

      - name: Compute deploy variables
        env:
          CUSTOM_DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          echo "IMAGE_PREFIX=$(echo '${{ vars.REGISTRY_URL }}/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
          echo "DEPLOY_DIR=${CUSTOM_DEPLOY_DIR:-$HOME/deployments/$REPO_NAME}" >> $GITHUB_ENV

      - name: Write .env file
        env:
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
          DB_MAX_OVERFLOW: ${{ vars.DB_MAX_OVERFLOW }}
          DB_POOL_TIMEOUT: ${{ vars.DB_POOL_TIMEOUT }}
          DB_SSL_MODE: ${{ vars.DB_SSL_MODE }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
          AGENT_CONTEXT_INSTRUCTIONS: ${{ vars.AGENT_CONTEXT_INSTRUCTIONS }}
        run: |
          mkdir -p "$DEPLOY_DIR"
          cat > "$DEPLOY_DIR/.env" <<ENVEOF
          BACKEND_PORT=${BACKEND_PORT:-8000}
          FRONTEND_PORT=${FRONTEND_PORT:-80}
          DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
          DB_POOL_SIZE=${DB_POOL_SIZE:-5}
          DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
          DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
          DB_SSL_MODE=${DB_SSL_MODE:-}
          AUTH_PASSWORD=${AUTH_PASSWORD:-}
          SMTP_HOST=${SMTP_HOST:-}
          SMTP_PORT=${SMTP_PORT:-587}
          SMTP_USER=${SMTP_USER:-}
          SMTP_PASS=${SMTP_PASS:-}
          SMTP_FROM=${SMTP_FROM:-}
          SMTP_USE_TLS=${SMTP_USE_TLS:-true}
          LLM_PROVIDER=${LLM_PROVIDER:-stub}
          LLM_API_KEY=${LLM_API_KEY:-}
          LLM_MODEL=${LLM_MODEL:-}
          SUMMARY_HOUR=${SUMMARY_HOUR:-8}
          AGENT_CONTEXT_INSTRUCTIONS=${AGENT_CONTEXT_INSTRUCTIONS:-}
          ENVEOF

      - name: Generate compose file
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > "$DEPLOY_DIR/docker-compose.yml" <<EOF
          services:
            backend:
              image: $IMAGE_PREFIX/backend:$IMAGE_TAG
              container_name: ${REPO_NAME}-backend
              expose:
                - "8000"
              volumes:
                - backend_data:/app/data
              env_file:
                - .env
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 10s
              networks:
                - app-network
            frontend:
              image: $IMAGE_PREFIX/frontend:$IMAGE_TAG
              container_name: ${REPO_NAME}-frontend
              ports:
                - "127.0.0.1:\${FRONTEND_PORT:-80}:80"
              depends_on:
                backend:
                  condition: service_healthy
              restart: unless-stopped
              networks:
                - app-network
          volumes:
            backend_data:
          networks:
            app-network:
          EOF

      - name: Persist deploy files to host
        run: |
          cat "$DEPLOY_DIR/.env" | docker run --rm -i -v "${DEPLOY_DIR}:/deploy" docker:27-cli sh -c 'cat > /deploy/.env'
          cat "$DEPLOY_DIR/docker-compose.yml" | docker run --rm -i -v "${DEPLOY_DIR}:/deploy" docker:27-cli sh -c 'cat > /deploy/docker-compose.yml'

      - name: Pull images
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" pull

      - name: Deploy services
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" up -d --remove-orphans

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' $REPO_NAME-backend 2>/dev/null || echo "not found")
            echo "Attempt $i: backend health=$status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "Backend health check failed"
          docker logs $REPO_NAME-backend --tail 50
          exit 1

      - name: Verify frontend
        run: |
          for i in $(seq 1 10); do
            docker exec $REPO_NAME-frontend wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Frontend verification failed"
          docker logs $REPO_NAME-frontend --tail 50
          exit 1

      - name: Show deployment status
        run: docker compose -f "$DEPLOY_DIR/docker-compose.yml" ps -a
