server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell and service worker must revalidate so UI deploys are visible immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location @spa {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Share API requests. Public share pages use /share/:token and must stay in the SPA.
    location ~ ^/share/(identity|project)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser navigation to /activity is a SPA route; XHR/fetch /activity remains the API.
    location = /activity {
        error_page 418 = @spa;
        if ($http_accept ~* "text/html") {
            return 418;
        }

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser navigation to /decisions is a SPA route; XHR/fetch /decisions remains the API.
    location = /decisions {
        error_page 418 = @spa;
        if ($http_accept ~* "text/html") {
            return 418;
        }

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser navigation to /graph-types is a SPA route; XHR/fetch (incl.
    # /graph-types/nodes and /graph-types/edges) is the API. Same shape as
    # /activity and /decisions above (ADR-0033 added this page + API prefix).
    location ~ ^/graph-types {
        error_page 418 = @spa;
        if ($http_accept ~* "text/html") {
            return 418;
        }

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to the backend service. nodes/tasks/backup are API-only
    # (their SPA pages are /explorer, /unfiled, /settings) so a plain proxy is safe.
    location ~ ^/(projects|identities|auth|health|search|webhook|integrations|analytics|workflow-rules|assistant|templates|notifications|api-keys|deliveries|api|ws|docs|openapi\.json|redoc|attachments|goals|saved-filters|cicd|settings|ical|nodes|tasks|backup) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
