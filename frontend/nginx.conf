server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every non-file, non-API route serves the app shell. The internal
    # API now lives under /api (ADR-0036), so page routes never collide with backend
    # paths and this single rule handles all of them, including reload / deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app shell and service worker must revalidate so UI deploys are visible immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /manifest.webmanifest {
        # .webmanifest is not in nginx's default MIME map and would be served
        # as application/octet-stream otherwise.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Internal API + the /api/v1 external API all live under /api (ADR-0036).
    #
    # Every backend location below ends in a slash, or is an exact `=` match, so it can
    # only claim a whole path segment. Written as `location /api` this was a bare prefix
    # and also claimed the SPA's own `/api-keys` page, which nginx then proxied to the
    # backend for a 404 — the page worked when reached by in-app navigation and broke on
    # reload or a shared link. `/webhook` did the same to `/webhook-logs`. The matching
    # rule has to be as segment-aware as the namespace it is enforcing.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inbound CI/CD webhook + issue-sync callbacks (external POSTs).
    location /webhook/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Share *data* API. The public share *page* (/share/n/:token) is an SPA route and
    # falls through to index.html above — which is why the data path uses a different
    # segment (`node`) than the page (`n`). See ADR-0071, ADR-0073.
    location ~ ^/share/node/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # iCal calendar feeds (external subscribers).
    location /ical/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check + API docs.
    location = /health { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location = /docs { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /docs/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location = /redoc { proxy_pass http://backend:8000; proxy_set_header Host $host; }

    # WebSocket for real-time sync.
    location = /ws {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Remote MCP (Streamable HTTP transport, ADR-0076). Served through this door rather
    # than its own hostname: the origin is only reachable through one tunnel, so a second
    # name would be DNS work for no new capability. The MCP server owns the `/mcp` route
    # itself, so the path is passed through unchanged.
    #
    # The upstream is a *variable* on purpose. `proxy_pass http://mcp:8001` resolves at
    # startup, so a deployment without the mcp container — which is every deployment that
    # has not set MCP_HTTP_TOKEN — would fail nginx's own boot and take the whole site
    # down with it. Through a variable, resolution happens per request: /mcp answers 502
    # and every other path is unaffected.
    location = /mcp {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_upstream "http://mcp:8001";
        proxy_pass $mcp_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamable HTTP keeps a response open and pushes events down it; buffering
        # would hold those until the stream ended, which is never.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
