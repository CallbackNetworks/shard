[project]
name = "shard-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E402", "E501", "E711", "E712"]

[tool.ruff.lint.per-file-ignores]
# Facade package: re-exports the whole graph API surface (ADR-0032/0033 split).
"app/services/graph/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
