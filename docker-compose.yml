services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app            # host source → container (hot-reload)
      - backend_venv:/app/.venv   # named volume protects the installed venv
      - backend_data:/app/data    # persist SQLite database
    environment:
      - DATABASE_URL=sqlite:////app/data/todo_platform.db
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app                    # host source → container (hot-reload)
      - frontend_modules:/app/node_modules # named volume protects installed packages
    environment:
      - BACKEND_URL=http://backend:8000    # vite proxy target (internal Docker network)
    depends_on:
      - backend
    networks:
      - app-network

  mcp:
    build: ./mcp_server
    volumes:
      - ./backend:/app/backend    # access backend source and SQLite DB
      - ./mcp_server:/app/mcp_server
    environment:
      - DB_PATH=${DB_PATH:-/app/backend/todo_platform.db}
    networks:
      - app-network

volumes:
  backend_venv:
  backend_data:
  frontend_modules:

networks:
  app-network:
