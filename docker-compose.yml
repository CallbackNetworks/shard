# Memory caps, for the same reason docker-compose.ci.yml has them (ADR-0111): this
# host runs the CI runner, the dev stack and ~20 unrelated containers in 8GB, and an
# unbounded container that over-asks does not fail — the kernel picks a victim by
# score, which has included things with nothing to do with this project. Sized as a
# cap, not to fit: measured, backend idles at ~140MB and the vite dev server at
# ~220MB, and the backend suite peaks at 597MB.
x-dev-limits: &dev-limits
  mem_limit: 2g
  memswap_limit: 2g # no swap headroom — swapping is what makes this host thrash

services:
  backend:
    <<: *dev-limits
    build: ./backend
    ports:
      # Bound to the loopback by default (ADR-0123). This host has a bare public IP and
      # no firewall in front of it, so `0.0.0.0` here put the dev stack on the internet:
      # the vite server served `/@fs/etc/passwd` to anyone who asked, the dev backend
      # answers `/api/*` with `AUTH_PASSWORD` empty, and Postgres sat open on 5432. The
      # Cloudflare tunnel reaches these containers over the compose network by service
      # name, not through a published port, so nothing that actually uses them needs a
      # wildcard bind. Set `BIND_HOST=0.0.0.0` in `.env` to opt back in, deliberately.
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app            # host source → container (hot-reload)
      - backend_venv:/app/.venv   # named volume protects the installed venv
      - ./data:/app/data           # persist SQLite database
      # No ./uploads mount here on purpose: this stack binds ./backend over /app,
      # so UPLOAD_DIR=/app/uploads already lands in ./backend/uploads on the host.
      # Adding one would move the dev attachment store and orphan what is there.
      # The production compose has no source mount and therefore needs its own —
      # it is generated in .github/workflows/ci.yml.
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_SSL_MODE=${DB_SSL_MODE:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - AUTH_TOKEN_TTL=${AUTH_TOKEN_TTL:-604800}
      - AUTH_MAX_ATTEMPTS=${AUTH_MAX_ATTEMPTS:-5}
      - AUTH_LOCKOUT_SECONDS=${AUTH_LOCKOUT_SECONDS:-300}
      - AUTH_PROXY_HEADER=${AUTH_PROXY_HEADER:-}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-0}
      - SECRET_KEY=${SECRET_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - SUMMARY_HOUR=${SUMMARY_HOUR:-8}
      - DIGEST_DAY=${DIGEST_DAY:-1}
      - AGENT_CONTEXT_INSTRUCTIONS=${AGENT_CONTEXT_INSTRUCTIONS:-}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-1}
      - BACKUP_HOUR=${BACKUP_HOUR:-3}
      - BACKUP_KEEP=${BACKUP_KEEP:-7}
      - BACKUP_DIR=${BACKUP_DIR:-/app/data/backups}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      # Remote MCP, served by this process (ADR-0080). No token, no /mcp route.
      # API_BASE_URL points at this same process on purpose: the tools stay
      # ``/api/v1`` clients, so the API key's scope is what bounds the endpoint.
      - MCP_HTTP_TOKEN=${MCP_HTTP_TOKEN:-}
      - API_BASE_URL=${MCP_API_BASE_URL:-http://localhost:8000}
      - API_KEY=${MCP_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  frontend:
    <<: *dev-limits
    build: ./frontend
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app                    # host source → container (hot-reload)
      - frontend_modules:/app/node_modules # named volume protects installed packages
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}  # vite proxy target (internal Docker network)
      # Vite rejects Host headers it does not know; the e2e container reaches the
      # dev server as http://frontend:5173, so that name has to be allowed.
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-frontend}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # node:20-slim ships neither wget nor curl; use node's http module
      # (dependency-free, mirrors the backend's python urllib check).
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app-network

  postgres:
    <<: *dev-limits
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shard}
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_dev}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  mysql:
    <<: *dev-limits
    image: mysql:8.0
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shard}
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  e2e:
    # Higher than the shared cap: this one drives a real Chromium.
    mem_limit: 3g
    memswap_limit: 3g
    build: ./e2e
    profiles: ["e2e"]
    depends_on:
      - backend
      - frontend
    environment:
      - BASE_URL=${E2E_BASE_URL:-http://frontend:5173}
      - API_URL=${E2E_API_URL:-http://backend:8000}
      - API_KEY=${API_KEY:-}
    networks:
      - app-network

volumes:
  backend_venv:
  frontend_modules:
  postgres_data:
  mysql_data:

networks:
  app-network:
