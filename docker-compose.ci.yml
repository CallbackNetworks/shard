# Standalone compose for CI — no host bind mounts (safe for Docker-in-Docker).

services:
  # ---------- lint / test / audit ----------
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
    networks:
      - ci-network

  frontend:
    build: ./frontend
    networks:
      - ci-network

  # ---------- PostgreSQL parity tests ----------
  postgres:
    profiles: [pgtest]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shard_test}
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-shard_test}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - ci-network

  # ---------- integration smoke test (prod images) ----------
  backend-prod:
    profiles: [integration]
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      ci-network:
        aliases:
          - backend

  frontend-prod:
    profiles: [integration]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "80"
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ci-network

networks:
  ci-network:
