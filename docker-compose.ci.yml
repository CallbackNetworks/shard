# Standalone compose for CI — no host bind mounts (safe for Docker-in-Docker).
#
# Every service here declares a memory limit. The runner shares one small host
# (6 CPUs / 8GB) with dev sessions and ~20 unrelated containers, and act_runner
# starts job containers as *siblings* through the Docker socket — so they are not
# bounded by the runner's own limit and default to the whole host. Unbounded, a
# job that asks for more than is free does not fail: the kernel picks a victim by
# score, and the victim is whatever happens to be biggest at that instant, which
# has included containers that had nothing to do with CI.
#
# The limits are not sized to what the work needs — measured, the frontend suite
# peaks around 260MB for 25 files in one process, and the ceiling it runs under
# makes no difference to that. They are sized as a cap: generous enough that
# normal work never touches them, tight enough that a runaway is killed here,
# named, instead of the kernel choosing something else on the host.
x-ci-limits: &ci-limits
  mem_limit: 2g
  memswap_limit: 2g # no swap headroom: swapping is what makes the host thrash

services:
  # ---------- lint / test / audit ----------
  backend:
    <<: *ci-limits
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
    networks:
      - ci-network

  frontend:
    <<: *ci-limits
    build: ./frontend
    networks:
      - ci-network

  # No `mcp` service: the MCP server is a module inside the backend package now
  # (ADR-0080), so its suite runs in the backend's own suite — against both
  # databases, like everything else. All its HTTP calls are mocked, so it needs
  # no running backend either way.

  # ---------- PostgreSQL test target (co-equal with SQLite, see ADR-0020) ----------
  postgres:
    <<: *ci-limits
    profiles: [pgtest]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shard_test}
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-shard_test}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - ci-network

  # ---------- integration smoke test (prod images) ----------
  backend-prod:
    <<: *ci-limits
    profiles: [integration]
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      ci-network:
        aliases:
          - backend

  frontend-prod:
    <<: *ci-limits
    profiles: [integration]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "80"
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ci-network

  # Runs against the prod images above rather than a stack of its own, so the
  # integration job pays for one build instead of two.
  e2e:
    # Not the shared cap: this one drives a real Chromium, which is heavier than
    # anything else here by a wide margin. Measured basis for the others — backend
    # suite 597MB, frontend 264MB — does not transfer to a browser.
    mem_limit: 3g
    memswap_limit: 3g
    profiles: [integration]
    build: ./e2e
    depends_on:
      frontend-prod:
        condition: service_healthy
    environment:
      - BASE_URL=${E2E_BASE_URL:-http://frontend-prod:80}
      - API_URL=${E2E_API_URL:-http://backend:8000}
      - API_KEY=${API_KEY:-}
    networks:
      - ci-network

networks:
  ci-network:
