# Standalone compose for CI — no host bind mounts (safe for Docker-in-Docker).

services:
  # ---------- lint / test / audit ----------
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
    networks:
      - ci-network

  frontend:
    build: ./frontend
    networks:
      - ci-network

  # The MCP server ships as part of the product (prod `mcp` profile), so its
  # suite gates the build like every other one. All its HTTP calls are mocked,
  # so it needs no backend.
  mcp:
    build: ./mcp_server
    working_dir: /app/mcp_server
    networks:
      - ci-network

  # ---------- PostgreSQL test target (co-equal with SQLite, see ADR-0020) ----------
  postgres:
    profiles: [pgtest]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shard_test}
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-shard_test}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - ci-network

  # ---------- integration smoke test (prod images) ----------
  backend-prod:
    profiles: [integration]
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/shard.db}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-stub}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      ci-network:
        aliases:
          - backend

  frontend-prod:
    profiles: [integration]
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    expose:
      - "80"
    depends_on:
      backend-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ci-network

  # Runs against the prod images above rather than a stack of its own, so the
  # integration job pays for one build instead of two.
  e2e:
    profiles: [integration]
    build: ./e2e
    depends_on:
      frontend-prod:
        condition: service_healthy
    environment:
      - BASE_URL=${E2E_BASE_URL:-http://frontend-prod:80}
      - API_URL=${E2E_API_URL:-http://backend:8000}
      - API_KEY=${API_KEY:-}
    networks:
      - ci-network

networks:
  ci-network:
